const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfto_is5Pu5JC-walATjF2B5zw_CjdeD4lF7WQ_k1fe6LxWgS_WikBUuNsvJE51NRDlw/exec";

async function loadResults() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    const out = {};
    for (const [key, val] of Object.entries(data.results || {})) {
      const numId = GAME_ID_MAP[key];
      if (numId !== undefined) out[numId] = { s1: val.home, s2: val.away };
    }
    return { groups: out, knockout: data.knockout || {} };
  } catch (err) {
    console.error("Erro ao carregar resultados:", err);
    return { groups: {}, knockout: {} };
  }
}

async function saveResult(jogoId, home, away) {
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ type: "grupo", jogoId, home, away }),
      headers: { "Content-Type": "application/json" }
    });
  } catch (err) {
    console.error("Erro ao salvar resultado:", err);
  }
}

async function saveKnockoutResult(jogoId, home, away, team1, team2) {
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ type: "knockout", jogoId: String(jogoId), home, away, team1, team2 }),
      headers: { "Content-Type": "application/json" }
    });
  } catch (err) {
    console.error("Erro ao salvar mata-mata:", err);
  }
}

function calcScore(real, bet) {
  if (real.s1 === null || !bet) return null;
  if (bet.s1 === real.s1 && bet.s2 === real.s2) return 5;
  const rw = real.s1 > real.s2 ? 1 : real.s1 < real.s2 ? 2 : 0;
  const bw = bet.s1  > bet.s2  ? 1 : bet.s1  < bet.s2  ? 2 : 0;
  if (rw !== bw) return 0;
  return Math.max(real.s1, real.s2) === Math.max(bet.s1, bet.s2) ? 3 : 2;
}

          </div>
          <nav style="display:flex;gap:4px;margin-top:12px;flex-wrap:wrap">
            ${[["ranking","🏆 Ranking"],["games","⚽ Jogos"],["bets","🎯 Palpites"],["knockout","🏅 Mata-Mata"]].map(([id, label]) => html`
              <button onClick=${() => setTab(id)} style="padding:8px 16px;border-radius:8px;border:none;font-weight:600;font-size:13px;background:${tab === id ? '#2a6f3a' : 'transparent'};color:${tab === id ? '#fff' : '#7a8aaa'}">
                ${label}
              </button>`)}
          </nav>
        </div>
      </header>

      <main style="max-width:900px;margin:0 auto;padding:20px 16px">

        <!-- RANKING -->
        ${tab === "ranking" && html`
          <div>
            <div style="margin-bottom:20px">
              <h2 style="margin:0 0 4px;font-size:18px;color:#c8d4ff">Classificação Geral</h2>
              <p style="margin:0;font-size:13px;color:#556">${played} de ${GAMES.length} jogos com resultado · Fase de grupos</p>
            </div>
            ${rankings.map((p, i) => {
              const medals = ["🥇","🥈","🥉"];
              const bgs = ["rgba(255,215,0,0.07)","rgba(192,192,192,0.05)","rgba(205,127,50,0.05)","transparent"];
              const borders = ["#b8860b","#666","#8b5a2b","#1e2845"];
              return html`
                <div style="background:${bgs[Math.min(i,3)]};border:1px solid ${borders[Math.min(i,3)]};border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px">
                  <div style="font-size:24px;width:36px;text-align:center">
                    ${i < 3 ? medals[i] : html`<span style="color:#445;font-size:16px;font-weight:700">${i+1}º</span>`}
                  </div>
                  <div style="flex:1">
                    <div style="font-weight:700;font-size:16px;color:#e8eaf0">${p.name}</div>
                    <div style="display:flex;gap:12px;margin-top:4px;flex-wrap:wrap">
                      <span style="font-size:12px;color:#4caf50">✅ ${p.exact} exatos</span>
                      <span style="font-size:12px;color:#ff9800">🎯 ${p.winner} venc+gols</span>
                      <span style="font-size:12px;color:#2196f3">↗ ${p.partial} parciais</span>
                    </div>
                  </div>
                  <div style="text-align:right;background:${i===0?'rgba(255,215,0,0.15)':'rgba(255,255,255,0.05)'};border-radius:10px;padding:8px 16px">
                    <div style="font-size:28px;font-weight:900;color:${i===0?'#ffd700':'#c8d4ff'};line-height:1">${p.pts}</div>
                    <div style="font-size:11px;color:#556;margin-top:2px">PONTOS</div>
                  </div>
                </div>`;
            })}
            <div style="margin-top:24px;background:#111929;border-radius:12px;padding:16px;border:1px solid #1e2845">
              <h3 style="margin:0 0 12px;font-size:14px;color:#7a8aaa">Sistema de Pontuação</h3>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                ${[["🎯 Placar Exato","5 pts"],["🏆 Vencedor + Gols do Vencedor","3 pts"],["✅ Vencedor Correto","2 pts"],["❌ Errou","0 pts"]].map(([d,v]) => html`
                  <div style="display:flex;justify-content:space-between;font-size:13px;color:#8899bb">
                    <span>${d}</span><span style="font-weight:700;color:#c8d4ff">${v}</span>
                  </div>`)}
              </div>
            </div>
          </div>`}

        <!-- JOGOS -->
        ${tab === "games" && html`
          <div>
            <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
              <span style="font-size:13px;color:#7a8aaa">Grupo:</span>
              <button onClick=${() => setGrpFilter("all")} style="padding:5px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;background:${grpFilter==='all'?'#2a6f3a':'#1e2845'};color:${grpFilter==='all'?'#fff':'#8899bb'}">Todos</button>
              ${groups.map(g => html`
                <button onClick=${() => setGrpFilter(g)} style="padding:5px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;background:${grpFilter===g?'#2a6f3a':'#1e2845'};color:${grpFilter===g?'#fff':'#8899bb'}">${g}</button>`)}
            </div>
            ${(grpFilter === "all" ? groups : [grpFilter]).map(grp => html`
              <div style="margin-bottom:24px">
                <h3 style="margin:0 0 10px;font-size:14px;color:#2a6f3a;letter-spacing:1px">● GRUPO ${grp}</h3>
                ${gamesWithResults.filter(g => g.g === grp).map(game => html`
                  <${GameCard}
                    game=${game}
                    editId=${editId}
                    setEditId=${setEditId}
                    editS=${editS}
                    setEditS=${setEditS}
                    onSave=${handleSave}
                    onClear=${handleClear}
                    setModal=${setModal}
                  />`)}
              </div>`)}
          </div>`}

        <!-- PALPITES -->
        ${tab === "bets" && html`
          <div>
            <h2 style="margin:0 0 8px;font-size:18px;color:#c8d4ff">Palpites por Jogo</h2>
            <p style="margin:0 0 16px;font-size:13px;color:#556">Clique em um jogo para ver os palpites de todos</p>
            ${groups.map(grp => html`
              <div style="margin-bottom:20px">
                <h3 style="margin:0 0 8px;font-size:13px;color:#2a6f3a;letter-spacing:1px">● GRUPO ${grp}</h3>
                ${gamesWithResults.filter(g => g.g === grp).map(game => html`
                  <button onClick=${() => setModal(game)} style="width:100%;background:${modal?.id===game.id?'#1e3a5f':'#111929'};border:1px solid ${modal?.id===game.id?'#3a7fd0':'#1e2845'};border-radius:8px;padding:10px 14px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;color:#c8d4ff;text-align:left">
                    <span style="font-size:13px"><span style="color:#556;margin-right:8px">J${game.id}</span>${game.t1} × ${game.t2}</span>
                    <span style="font-size:12px;color:#556">${game.date}</span>
                  </button>`)}
              </div>`)}
          </div>`}

        <!-- MATA-MATA -->
        ${tab === "knockout" && html`
          <${KnockoutTab} knockout=${knockout} onSave=${handleSaveKnockout} />
        `}

      </main>

      <!-- MODAL DE PALPITES (fase de grupos) -->
      ${modal && html`
        <div class="modal-backdrop" onClick=${() => setModal(null)}>
          <div class="modal" onClick=${e => e.stopPropagation()}>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
              <div>
                <div style="font-size:12px;color:#556;margin-bottom:4px">Jogo ${modal.id} · Grupo ${modal.g}</div>
                <div style="font-size:18px;font-weight:700;color:#e8eaf0">${flag(modal.t1)} ${modal.t1} × ${modal.t2} ${flag(modal.t2)}</div>
                <div style="font-size:12px;color:#556;margin-top:4px">${modal.date} · ${modal.time} · ${modal.city}</div>
              </div>
              <button onClick=${() => setModal(null)} style="background:none;border:none;color:#556;font-size:20px;line-height:1">✕</button>
            </div>
            ${modal.s1 !== null && html`
              <div style="background:#0a1226;border-radius:10px;padding:12px 20px;margin-bottom:16px;text-align:center;border:1px solid #2a6f3a">
                <div style="font-size:12px;color:#2a6f3a;margin-bottom:4px">RESULTADO OFICIAL</div>
                <div style="font-size:36px;font-weight:900;letter-spacing:4px">
                  <span style="color:#4caf50">${modal.s1}</span>
                  <span style="color:#334;margin:0 8px">–</span>
                  <span style="color:#4caf50">${modal.s2}</span>
                </div>
              </div>`}
            <div style="display:flex;flex-direction:column;gap:8px">
              ${PARTICIPANTS.map(p => {
                const bet = (BETS[p.id] || {})[`${modal.t1}|${modal.t2}`];
                const pts = modal.s1 !== null ? calcScore(modal, bet) : null;
                const ptCol = { 5:"#4caf50", 3:"#ff9800", 2:"#2196f3", 0:"#f44336" };
                return html`
                  <div style="background:#0d1526;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:1px solid ${pts!==null?(pts>0?'#1e3a2f':'#3a1e1e'):'#1a2035'}">
                    <div style="flex:1;font-weight:600;font-size:14px">${p.name}</div>
                    ${bet
                      ? html`<div style="font-size:22px;font-weight:700;color:#8899bb;letter-spacing:2px">${bet.s1} <span style="color:#334">–</span> ${bet.s2}</div>`
                      : html`<div style="font-size:13px;color:#334">sem palpite</div>`}
                    ${pts !== null && html`
                      <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${ptCol[pts]}22;color:${ptCol[pts]};font-weight:800;font-size:14px">${pts}</div>`}
                  </div>`;
              })}
            </div>
          </div>
        </div>`}
    </div>`;
}

// ── GAME CARD (fase de grupos) ────────────────────────────────────────────────
function GameCard({ game, editId, setEditId, editS, setEditS, onSave, onClear, setModal }) {
  const hasResult = game.s1 !== null;
  const isEditing = editId === game.id;
  return html`
    <div style="background:#0d1526;border:1px solid ${hasResult?'#1e3a2f':'#1e2845'};border-radius:10px;padding:12px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="min-width:72px;font-size:11px;color:#445">${game.date}<br/>${game.time}</div>
        <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:180px">
          <span style="font-size:14px;font-weight:600;color:#c8d4ff">${game.t1}</span>
          ${hasResult
            ? html`<span style="font-size:20px;font-weight:900;color:#4caf50;letter-spacing:2px">${game.s1} – ${game.s2}</span>`
            : html`<span style="color:#334;font-size:16px">×</span>`}
          <span style="font-size:14px;font-weight:600;color:#c8d4ff">${game.t2}</span>
        </div>
        <div style="font-size:11px;color:#334">${game.city}</div>
        <div style="display:flex;gap:6px">
          <button onClick=${() => setModal(game)} style="background:#1e2845;border:none;border-radius:6px;padding:5px 10px;color:#7a8aaa;font-size:12px;font-weight:600">🎯 Ver</button>
          <button onClick=${() => { setEditId(game.id); setEditS({ s1: game.s1 ?? '', s2: game.s2 ?? '' }); }}
            style="background:${hasResult?'#1e3a2f':'#1e2845'};border:none;border-radius:6px;padding:5px 10px;color:${hasResult?'#4caf50':'#7a8aaa'};font-size:12px;font-weight:600">
            ${hasResult ? "✏️ Editar" : "➕ Resultado"}
          </button>
          ${hasResult && html`
            <button onClick=${() => onClear(game.id)} style="background:#3a1e1e;border:none;border-radius:6px;padding:5px 8px;color:#f44336;font-size:12px">🗑</button>`}
        </div>
      </div>
      ${isEditing && html`
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #1e2845;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:13px;color:#7a8aaa">Resultado:</span>
          <span style="font-size:13px;color:#c8d4ff;font-weight:600">${game.t1}</span>
          <input type="number" min="0" max="20" value=${editS.s1}
            onInput=${e => setEditS(s => ({ ...s, s1: e.target.value }))}
            style="width:48px;text-align:center;background:#0a1226;border:1px solid #2a6f3a;border-radius:6px;color:#4caf50;font-size:18px;font-weight:700;padding:4px 6px" />
          <span style="color:#334">–</span>
          <input type="number" min="0" max="20" value=${editS.s2}
            onInput=${e => setEditS(s => ({ ...s, s2: e.target.value }))}
            style="width:48px;text-align:center;background:#0a1226;border:1px solid #2a6f3a;border-radius:6px;color:#4caf50;font-size:18px;font-weight:700;padding:4px 6px" />
          <span style="font-size:13px;color:#c8d4ff;font-weight:600">${game.t2}</span>
          <button onClick=${() => onSave(game.id, editS.s1, editS.s2)}
            style="background:#2a6f3a;border:none;border-radius:6px;padding:6px 14px;color:#fff;font-weight:700;font-size:13px">✓ Salvar</button>
          <button onClick=${() => setEditId(null)}
            style="background:#1e2845;border:none;border-radius:6px;padding:6px 10px;color:#7a8aaa;font-size:13px">✕</button>
        </div>`}
    </div>`;
}

// ── MATA-MATA: COMPONENTES ────────────────────────────────────────────────────
function KnockoutTab({ knockout, onSave }) {
  const phases = ['dezesseis','oitavas','quartas','semi','terceiro','final'];
  return html`
    <div>
      <div style="margin-bottom:20px">
        <h2 style="margin:0 0 4px;font-size:18px;color:#c8d4ff">Fase Mata-Mata</h2>
        <p style="margin:0;font-size:13px;color:#556">Resultados e classificados atualizados conforme o torneio avança</p>
      </div>
      ${phases.map(phase => {
        const games = KNOCKOUT_GAMES.filter(g => g.phase === phase);
        return html`
          <div style="margin-bottom:28px" key=${phase}>
            <h3 style="margin:0 0 10px;font-size:14px;font-weight:700;color:#fff;background:${PHASE_COLORS[phase]};border-radius:8px;padding:7px 14px;display:inline-block">
              ${PHASE_LABELS[phase]}
            </h3>
            ${games.map(game => html`
              <${KnockoutCard}
                key=${game.id}
                game=${game}
                data=${knockout[game.id] || {}}
                onSave=${onSave}
              />`)}
          </div>`;
      })}
    </div>`;
}

const PHASE_COLORS = {
  dezesseis:'#1a7a3c', oitavas:'#2e75b6', quartas:'#2e75b6',
  semi:'#2e75b6', terceiro:'#595959', final:'#b8860b'
};

function KnockoutCard({ game, data, onSave }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ team1:'', team2:'', s1:'', s2:'' });

  const hasResult = data.goals1 !== undefined && data.goals2 !== undefined;
  const t1 = data.team1 || game.team1;
  const t2 = data.team2 || game.team2;
  const isFinal = game.phase === 'final';

  function startEdit() {
    setForm({ team1: data.team1 || game.team1, team2: data.team2 || game.team2, s1: data.goals1 ?? '', s2: data.goals2 ?? '' });
    setEditing(true);
  }

  async function handleSave() {
    await onSave(game.id, form.s1, form.s2, form.team1, form.team2);
    setEditing(false);
  }

  const isPending1 = game.p1 && !data.team1;
  const isPending2 = game.p2 && !data.team2;

  return html`
    <div style="background:#0d1526;border:1px solid ${isFinal?'#b8860b':hasResult?'#1e3a2f':'#1e2845'};border-radius:10px;margin-bottom:8px;overflow:hidden;${isFinal?'box-shadow:0 2px 12px rgba(184,134,11,.2)':''}">

      <!-- Header -->
      <div style="display:flex;align-items:center;gap:8px;background:#0a1020;padding:5px 12px;border-bottom:1px solid #1e2845">
        <span style="font-size:11px;font-weight:700;color:#2a6f3a">J${game.id}</span>
        <span style="font-size:11px;color:#445">📍 ${game.city}</span>
        <span style="font-size:11px;color:#445;margin-left:auto">${game.date}</span>
      </div>

      <!-- Placar -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px">
        <span style="flex:1;text-align:right;font-size:${isFinal?'15px':'13px'};font-weight:${isFinal?'800':'600'};color:${isPending1?'#6a4010':'#c8d4ff'};font-style:${isPending1?'italic':'normal'}">
          ${flag(t1)} ${t1}
        </span>
        <div style="min-width:72px;text-align:center">
          ${hasResult
            ? html`<span style="background:${isFinal?'#b8860b':'#1a7a3c'};color:#fff;font-weight:900;border-radius:6px;padding:4px 10px;font-size:${isFinal?'18px':'15px'}">${data.goals1} × ${data.goals2}</span>`
            : html`<span style="background:#1e2845;color:#445;border-radius:6px;padding:4px 8px;font-size:12px">– × –</span>`}
        </div>
        <span style="flex:1;text-align:left;font-size:${isFinal?'15px':'13px'};font-weight:${isFinal?'800':'600'};color:${isPending2?'#6a4010':'#c8d4ff'};font-style:${isPending2?'italic':'normal'}">
          ${flag(t2)} ${t2}
        </span>
        <button onClick=${startEdit}
          style="background:${hasResult?'#1e3a2f':'#1e2845'};border:none;border-radius:6px;padding:5px 10px;color:${hasResult?'#4caf50':'#7a8aaa'};font-size:12px;font-weight:600;white-space:nowrap">
          ${hasResult ? "✏️ Editar" : "➕ Resultado"}
        </button>
      </div>

      <!-- Formulário de edição -->
      ${editing && html`
        <div style="padding:12px 14px;border-top:1px solid #1e2845;background:#080e1c">
          <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
            <div style="flex:1;min-width:140px">
              <div style="font-size:11px;color:#556;margin-bottom:3px">Time 1</div>
              <input value=${form.team1} onInput=${e => setForm(f=>({...f,team1:e.target.value}))}
                style="width:100%;background:#0a1226;border:1px solid #2a4a6a;border-radius:6px;color:#c8d4ff;font-size:13px;padding:5px 8px" />
            </div>
            <div style="flex:1;min-width:140px">
              <div style="font-size:11px;color:#556;margin-bottom:3px">Time 2</div>
              <input value=${form.team2} onInput=${e => setForm(f=>({...f,team2:e.target.value}))}
                style="width:100%;background:#0a1226;border:1px solid #2a4a6a;border-radius:6px;color:#c8d4ff;font-size:13px;padding:5px 8px" />
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="font-size:12px;color:#7a8aaa">Resultado:</span>
            <input type="number" min="0" max="20" value=${form.s1}
              onInput=${e => setForm(f=>({...f,s1:e.target.value}))}
              style="width:48px;text-align:center;background:#0a1226;border:1px solid #2a6f3a;border-radius:6px;color:#4caf50;font-size:18px;font-weight:700;padding:4px 6px" />
            <span style="color:#334">–</span>
            <input type="number" min="0" max="20" value=${form.s2}
              onInput=${e => setForm(f=>({...f,s2:e.target.value}))}
              style="width:48px;text-align:center;background:#0a1226;border:1px solid #2a6f3a;border-radius:6px;color:#4caf50;font-size:18px;font-weight:700;padding:4px 6px" />
            <button onClick=${handleSave}
              style="background:#2a6f3a;border:none;border-radius:6px;padding:6px 14px;color:#fff;font-weight:700;font-size:13px">✓ Salvar</button>
            <button onClick=${() => setEditing(false)}
              style="background:#1e2845;border:none;border-radius:6px;padding:6px 10px;color:#7a8aaa;font-size:13px">✕</button>
          </div>
        </div>`}
    </div>`;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
