// ── SCORING ───────────────────────────────────────────────────────────────────
function score(real, bet) {
  if (real.s1 === null || !bet) return null;
  if (bet.s1 === real.s1 && bet.s2 === real.s2) return 5;
  const rw = real.s1 > real.s2 ? 1 : real.s1 < real.s2 ? 2 : 0;
  const bw = bet.s1  > bet.s2  ? 1 : bet.s1  < bet.s2  ? 2 : 0;
  if (rw !== bw) return 0;
  return Math.max(real.s1, real.s2) === Math.max(bet.s1, bet.s2) ? 3 : 2;
}

            <p style="margin:0 0 16px;font-size:13px;color:#556">Clique em um jogo para ver os palpites de todos</p>
            ${groups.map(grp => html`
              <div style="margin-bottom:20px">
                <h3 style="margin:0 0 8px;font-size:13px;color:#2a6f3a;letter-spacing:1px">● GRUPO ${grp}</h3>
                ${gamesWithResults.filter(g=>g.g===grp).map(game => html`
                  <button onClick=${()=>setModal(game)} style="width:100%;background:${modal?.id===game.id?'#1e3a5f':'#111929'};border:1px solid ${modal?.id===game.id?'#3a7fd0':'#1e2845'};border-radius:8px;padding:10px 14px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;color:#c8d4ff;text-align:left">
                    <span style="font-size:13px"><span style="color:#556;margin-right:8px">J${game.id}</span>${game.t1} × ${game.t2}</span>
                    <span style="font-size:12px;color:#556">${game.date}</span>
                  </button>`)}
              </div>`)}
          </div>`}

      </main>

      <!-- PALPITES MODAL -->
      ${modal && html`
        <div class="modal-backdrop" onClick=${()=>setModal(null)}>
          <div class="modal" onClick=${e=>e.stopPropagation()}>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
              <div>
                <div style="font-size:12px;color:#556;margin-bottom:4px">Jogo ${modal.id} · Grupo ${modal.g}</div>
                <div style="font-size:18px;font-weight:700;color:#e8eaf0">${flag(modal.t1)} ${modal.t1} × ${modal.t2} ${flag(modal.t2)}</div>
                <div style="font-size:12px;color:#556;margin-top:4px">${modal.date} · ${modal.time} · ${modal.city}</div>
              </div>
              <button onClick=${()=>setModal(null)} style="background:none;border:none;color:#556;font-size:20px;line-height:1">✕</button>
            </div>
            ${modal.s1 !== null && html`
              <div style="background:#0a1226;border-radius:10px;padding:12px 20px;margin-bottom:16px;text-align:center;border:1px solid #2a6f3a">
                <div style="font-size:12px;color:#2a6f3a;margin-bottom:4px">RESULTADO OFICIAL</div>
                <div style="font-size:36px;font-weight:900;letter-spacing:4px">
                  <span style="color:#4caf50">${modal.s1}</span>
                  <span style="color:#334;margin:0 8px">–</span>
                  <span style="color:#4caf50">${modal.s2}</span>
                </div>
              </div>`}
            <div style="display:flex;flex-direction:column;gap:8px">
              ${PARTICIPANTS.map(p => {
                const bet = (BETS[p.id]||{})[`${modal.t1}|${modal.t2}`];
                const pts = modal.s1 !== null ? score(modal, bet) : null;
                const ptCol = {5:"#4caf50",3:"#ff9800",2:"#2196f3",0:"#f44336"};
                return html`
                  <div style="background:#0d1526;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:1px solid ${pts!==null?(pts>0?'#1e3a2f':'#3a1e1e'):'#1a2035'}">
                    <div style="flex:1;font-weight:600;font-size:14px">${p.name}</div>
                    ${bet ? html`<div style="font-size:22px;font-weight:700;color:#8899bb;letter-spacing:2px">${bet.s1} <span style="color:#334">–</span> ${bet.s2}</div>` : html`<div style="font-size:13px;color:#334">sem palpite</div>`}
                    ${pts !== null && html`
                      <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${ptCol[pts]}22;color:${ptCol[pts]};font-weight:800;font-size:14px">${pts}</div>`}
                  </div>`;
              })}
            </div>
          </div>
        </div>`}
    </div>`;
}

function GameCard({ game, editId, setEditId, editS, setEditS, saveResult, clearResult, setModal }) {
  const hasResult = game.s1 !== null;
  const isEditing = editId === game.id;
  return html`
    <div style="background:#0d1526;border:1px solid ${hasResult?'#1e3a2f':'#1e2845'};border-radius:10px;padding:12px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="min-width:72px;font-size:11px;color:#445">${game.date}<br/>${game.time}</div>
        <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:180px">
          <span style="font-size:14px;font-weight:600;color:#c8d4ff">${game.t1}</span>
          ${hasResult
            ? html`<span style="font-size:20px;font-weight:900;color:#4caf50;letter-spacing:2px">${game.s1} – ${game.s2}</span>`
            : html`<span style="color:#334;font-size:16px">×</span>`}
          <span style="font-size:14px;font-weight:600;color:#c8d4ff">${game.t2}</span>
        </div>
        <div style="font-size:11px;color:#334">${game.city}</div>
        <div style="display:flex;gap:6px">
          <button onClick=${()=>setModal(game)} style="background:#1e2845;border:none;border-radius:6px;padding:5px 10px;color:#7a8aaa;font-size:12px;font-weight:600">🎯 Ver</button>
          <button onClick=${()=>{setEditId(game.id);setEditS({s1:game.s1??'',s2:game.s2??''});}} style="background:${hasResult?'#1e3a2f':'#1e2845'};border:none;border-radius:6px;padding:5px 10px;color:${hasResult?'#4caf50':'#7a8aaa'};font-size:12px;font-weight:600">
            ${hasResult?"✏️ Editar":"➕ Resultado"}
          </button>
          ${hasResult && html`<button onClick=${()=>clearResult(game.id)} style="background:#3a1e1e;border:none;border-radius:6px;padding:5px 8px;color:#f44336;font-size:12px">🗑</button>`}
        </div>
      </div>
      ${isEditing && html`
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #1e2845;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:13px;color:#7a8aaa">Resultado:</span>
          <span style="font-size:13px;color:#c8d4ff;font-weight:600">${game.t1}</span>
          <input type="number" min="0" max="20" value=${editS.s1} onInput=${e=>setEditS(s=>({...s,s1:e.target.value}))}
            style="width:48px;text-align:center;background:#0a1226;border:1px solid #2a6f3a;border-radius:6px;color:#4caf50;font-size:18px;font-weight:700;padding:4px 6px" />
          <span style="color:#334">–</span>
          <input type="number" min="0" max="20" value=${editS.s2} onInput=${e=>setEditS(s=>({...s,s2:e.target.value}))}
            style="width:48px;text-align:center;background:#0a1226;border:1px solid #2a6f3a;border-radius:6px;color:#4caf50;font-size:18px;font-weight:700;padding:4px 6px" />
          <span style="font-size:13px;color:#c8d4ff;font-weight:600">${game.t2}</span>
          <button onClick=${()=>saveResult(game.id,editS.s1,editS.s2)} style="background:#2a6f3a;border:none;border-radius:6px;padding:6px 14px;color:#fff;font-weight:700;font-size:13px">✓ Salvar</button>
          <button onClick=${()=>setEditId(null)} style="background:#1e2845;border:none;border-radius:6px;padding:6px 10px;color:#7a8aaa;font-size:13px">✕</button>
        </div>`}
    </div>`;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
